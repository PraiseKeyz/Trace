<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trace Logo Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #94a3b8;
      padding: 48px 32px;
    }
    h1 { color: #F97316; font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 40px; }
    .section { margin-bottom: 48px; }
    .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #475569; margin-bottom: 20px; }
    .row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }

    /* Dark background swatches */
    .swatch-dark {
      background: #020617;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    /* Light background swatch */
    .swatch-light {
      background: #F9F6F0;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    /* Orange swatch */
    .swatch-orange {
      background: #F97316;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .size-label { font-size: 10px; text-align: center; margin-top: 8px; color: #475569; }
    .chip { display: flex; flex-direction: column; align-items: center; }

    /* Wordmark row */
    .wordmark {
      display: flex; align-items: center; gap: 14px;
      background: #020617;
      padding: 20px 28px;
      border-radius: 16px;
    }
    .wordmark-text {
      font-size: 36px; font-weight: 900; color: white; letter-spacing: -0.02em;
      font-family: 'Segoe UI', sans-serif;
    }
    .wordmark-sub {
      font-size: 10px; font-weight: 700; color: #F97316;
      letter-spacing: 0.18em; text-transform: uppercase; margin-top: 2px;
    }
    .wordmark-light {
      background: #F9F6F0;
    }
    .wordmark-light .wordmark-text { color: #020617; }
  </style>
</head>
<body>
  <h1>Trace — Logo Preview</h1>

  <!-- Icon sizes on dark -->
  <div class="section">
    <div class="section-label">Icon — Dark background</div>
    <div class="row">
      <div class="chip">
        <div class="swatch-dark"><img src="../frontend/public/trace-logo.svg" width="256" height="256"/></div>
        <div class="size-label">256 × 256</div>
      </div>
      <div class="chip">
        <div class="swatch-dark"><img src="../frontend/public/trace-logo.svg" width="128" height="128"/></div>
        <div class="size-label">128 × 128</div>
      </div>
      <div class="chip">
        <div class="swatch-dark"><img src="../frontend/public/trace-logo.svg" width="64" height="64"/></div>
        <div class="size-label">64 × 64</div>
      </div>
      <div class="chip">
        <div class="swatch-dark"><img src="../frontend/public/trace-logo.svg" width="32" height="32"/></div>
        <div class="size-label">32 × 32</div>
      </div>
      <div class="chip">
        <div class="swatch-dark" style="padding:12px"><img src="../frontend/public/trace-logo.svg" width="16" height="16"/></div>
        <div class="size-label">16 × 16</div>
      </div>
    </div>
  </div>

  <!-- Icon on light background -->
  <div class="section">
    <div class="section-label">Icon — Light background</div>
    <div class="row">
      <div class="chip">
        <div class="swatch-light"><img src="../frontend/public/trace-logo.svg" width="128" height="128"/></div>
        <div class="size-label">128 × 128</div>
      </div>
      <div class="chip">
        <div class="swatch-light"><img src="../frontend/public/trace-logo.svg" width="64" height="64"/></div>
        <div class="size-label">64 × 64</div>
      </div>
      <div class="chip">
        <div class="swatch-light"><img src="../frontend/public/trace-logo.svg" width="32" height="32"/></div>
        <div class="size-label">32 × 32</div>
      </div>
    </div>
  </div>

  <!-- Icon on orange -->
  <div class="section">
    <div class="section-label">Icon — On brand orange</div>
    <div class="row">
      <div class="chip">
        <div class="swatch-orange"><img src="../frontend/public/trace-logo.svg" width="96" height="96"/></div>
        <div class="size-label">96 × 96</div>
      </div>
    </div>
  </div>

  <!-- Wordmark combos -->
  <div class="section">
    <div class="section-label">Wordmark — Icon + Name</div>
    <div class="row">
      <div class="wordmark">
        <img src="../frontend/public/trace-logo.svg" width="52" height="52"/>
        <div>
          <div class="wordmark-text">Trace</div>
          <div class="wordmark-sub">Economic Identity</div>
        </div>
      </div>
      <div class="wordmark wordmark-light">
        <img src="../frontend/public/trace-logo.svg" width="52" height="52"/>
        <div>
          <div class="wordmark-text">Trace</div>
          <div class="wordmark-sub">Economic Identity</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
